<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Quant Engine - Gestionnaire 7j/7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- MODULE PRINCIPAL : COUPON ACTIF -->
    <div class="coupon-card">
      <div class="coupon-header">
        <div>
          <h3>⚽ Apex Quant Engine - Coupon Actif</h3>
          <small id="coupon-date-display" class="subtitle"></small>
        </div>
        <div id="coupon-status" class="coupon-status status-pending">⏳ EN COURS</div>
      </div>

      <div class="coupon-actions">
        <button id="btn-paste-coupon" class="btn btn-outline" onclick="handlePasteCoupon()">📋 Coller</button>
        <button id="btn-copy-coupon" class="btn btn-outline" onclick="handleCopyCoupon()">📤 Copier</button>
        <button id="btn-export-coupon" class="btn btn-primary" onclick="handleExportCoupon()">📥 Exporter (.txt)</button>
      </div>

      <div id="coupon-content"></div>
    </div>

    <!-- MODULE HISTORIQUE & STATISTIQUES -->
    <div class="history-card">
      <div class="history-header">
        <h4>📜 Historique des Coupons (<span id="history-count">0</span>)</h4>
        <button class="btn-danger-link" onclick="handleClearAllHistory()">🗑️ Tout effacer</button>
      </div>
      
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
