<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire & Historique de Coupons</title>
  <style>
    /* STYLES CSS */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 550px;
    }

    .coupon-card, .history-card {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .coupon-header, .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .coupon-header h3, .history-header h4 {
      margin: 0;
      color: #0f172a;
    }

    .coupon-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: #2563eb; color: white; }
    .btn-primary:hover { background-color: #1d4ed8; }

    .btn-outline { background-color: #f8fafc; border: 1px solid #cbd5e1; color: #334155; }
    .btn-outline:hover { background-color: #e2e8f0; }

    .btn.success { background-color: #22c55e !important; color: white !important; border-color: #22c55e !important; }

    .btn-danger-link {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-danger-link:hover { text-decoration: underline; }

    /* Statuts */
    .coupon-status {
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }
    .status-won { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .status-lost { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .status-pending { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    /* Matchs */
    .match-list { list-style: none; padding: 0; margin: 0; }
    .match-item { border-bottom: 1px solid #f1f5f9; padding: 12px 0; }
    .match-item:last-child { border-bottom: none; }
    .match-league { font-size: 0.75rem; font-weight: bold; color: #64748b; text-transform: uppercase; }
    .match-teams { font-weight: 600; font-size: 1rem; color: #1e293b; margin: 4px 0; }
    .match-details { display: flex; justify-content: space-between; font-size: 0.9rem; color: #334155; }

    /* Historique */
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      background-color: #f8fafc;
      transition: all 0.2s;
    }
    .history-item:hover { background-color: #f1f5f9; }
    .history-item.active-history-item { border-left: 4px solid #2563eb; background-color: #eff6ff; }
    .history-item-info { display: flex; flex-direction: column; gap: 2px; }
    .history-date { font-size: 0.85rem; font-weight: bold; color: #1e293b; }
    .history-details { font-size: 0.8rem; color: #64748b; }
    .history-item-actions { display: flex; align-items: center; gap: 8px; }
    .btn-delete-icon { background: none; border: none; cursor: pointer; opacity: 0.6; }
    .btn-delete-icon:hover { opacity: 1; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. COUPON ACTIF -->
    <div class="coupon-card">
      <div class="coupon-header">
        <div>
          <h3>⚽ Coupon Actif</h3>
          <small id="coupon-date-display" style="color: #64748b;"></small>
        </div>
        <div id="coupon-status" class="coupon-status status-pending">⏳ EN COURS</div>
      </div>

      <div class="coupon-actions">
        <button id="btn-paste-coupon" class="btn btn-outline" onclick="handlePasteCoupon()">📋 Coller</button>
        <button id="btn-copy-coupon" class="btn btn-outline" onclick="handleCopyCoupon()">📤 Copier</button>
        <button id="btn-export-coupon" class="btn btn-primary" onclick="handleExportCoupon()">📥 Exporter (.txt)</button>
      </div>

      <div id="coupon-content"></div>
    </div>

    <!-- 2. HISTORIQUE -->
    <div class="history-card">
      <div class="history-header">
        <h4>📜 Historique (<span id="history-count">0</span>)</h4>
        <button class="btn-danger-link" onclick="handleClearAllHistory()">🗑️ Tout effacer</button>
      </div>
      
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <!-- SCRIPT JAVASCRIPT -->
  <script>
    const HISTORY_STORAGE_KEY = "coupons_multi_history_v1";
    let activeCoupon = null;

    function getHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveHistory(history) {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
        renderHistoryUI();
      } catch (e) {}
    }

    function saveCouponToHistory(coupon) {
      const history = getHistory();
      const existingIndex = history.findIndex(item => item.id === coupon.id);
      if (existingIndex >= 0) {
        history[existingIndex] = coupon;
      } else {
        history.unshift(coupon);
      }
      saveHistory(history);
    }

    function deleteCouponFromHistory(id, event) {
      if (event) event.stopPropagation();
      if (confirm("Supprimer ce coupon de l'historique ?")) {
        let history = getHistory().filter(item => item.id !== id);
        saveHistory(history);
        if (activeCoupon && activeCoupon.id === id) {
          activeCoupon = history.length > 0 ? history[0] : getDemoCoupon();
          renderActiveCouponUI(activeCoupon);
        }
      }
    }

    function handleClearAllHistory() {
      if (confirm("Effacer tout l'historique ?")) {
        localStorage.removeItem(HISTORY_STORAGE_KEY);
        activeCoupon = getDemoCoupon();
        renderActiveCouponUI(activeCoupon);
        renderHistoryUI();
      }
    }

    function getCouponStatus(selections) {
      if (selections.some(item => item.status === "PERDU")) return { text: "❌ PERDU", code: "lost" };
      if (selections.every(item => item.status === "GAGNÉ")) return { text: "✅ GAGNÉ", code: "won" };
      return { text: "⏳ EN COURS", code: "pending" };
    }

    function calculateTotalOdds(selections) {
      return selections.reduce((total, item) => total * item.odds, 1).toFixed(2);
    }

    function renderActiveCouponUI(coupon) {
      activeCoupon = coupon;
      const container = document.getElementById("coupon-content");
      const statusBadge = document.getElementById("coupon-status");
      const dateDisplay = document.getElementById("coupon-date-display");

      const statusInfo = getCouponStatus(coupon.selections);
      statusBadge.textContent = statusInfo.text;
      statusBadge.className = `coupon-status status-${statusInfo.code}`;
      dateDisplay.textContent = `Date : ${coupon.date}`;

      let html = `<ul class="match-list">`;
      coupon.selections.forEach((item, index) => {
        const icon = item.status === "GAGNÉ" ? "✅" : item.status === "PERDU" ? "❌" : "⏳";
        html += `
          <li class="match-item">
            <div class="match-league">${index + 1}. [${item.league}]</div>
            <div class="match-teams">⚔️ ${item.match}</div>
            <div class="match-details">
              <span>🎯 Prono : <strong>${item.pick}</strong></span>
              <span>📊 Cote : <strong>${item.odds.toFixed(2)}</strong></span>
            </div>
            <div style="font-size:0.85rem; margin-top:4px; color:#475569;">
              Statut : <strong>${icon} ${item.status}</strong>
            </div>
          </li>`;
      });
      html += `</ul>`;
      container.innerHTML = html;
    }

    function renderHistoryUI() {
      const historyList = document.getElementById("history-list");
      const countDisplay = document.getElementById("history-count");
      const history = getHistory();

      countDisplay.textContent = history.length;

      if (history.length === 0) {
        historyList.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:12px; margin:0;">Aucun coupon dans l'historique.</p>`;
        return;
      }

      let html = "";
      history.forEach(item => {
        const statusInfo = getCouponStatus(item.selections);
        const totalOdds = calculateTotalOdds(item.selections);
        const isActive = activeCoupon && activeCoupon.id === item.id ? "active-history-item" : "";

        html += `
          <div class="history-item ${isActive}" onclick="loadCouponFromHistory('${item.id}')">
            <div class="history-item-info">
              <span class="history-date">📅 ${item.date}</span>
              <span class="history-details">${item.selections.length} matchs | Cote : <strong>${totalOdds}</strong></span>
            </div>
            <div class="history-item-actions">
              <span class="coupon-status status-${statusInfo.code}">${statusInfo.text}</span>
              <button class="btn-delete-icon" onclick="deleteCouponFromHistory('${item.id}', event)">🗑️</button>
            </div>
          </div>`;
      });

      historyList.innerHTML = html;
    }

    function loadCouponFromHistory(id) {
      const history = getHistory();
      const selected = history.find(item => item.id === id);
      if (selected) {
        renderActiveCouponUI(selected);
        renderHistoryUI();
      }
    }

    async function handlePasteCoupon() {
      const btn = document.getElementById("btn-paste-coupon");
      try {
        const pastedText = await navigator.clipboard.readText();
        const parsed = parseCouponText(pastedText);
        if (!parsed) { alert("Format du texte collé invalide."); return; }

        const newCoupon = { id: "coupon_" + Date.now(), date: parsed.date, selections: parsed.selections };
        saveCouponToHistory(newCoupon);
        renderActiveCouponUI(newCoupon);

        btn.innerHTML = "✅ Collé !";
        btn.classList.add("success");
        setTimeout(() => { btn.innerHTML = "📋 Coller"; btn.classList.remove("success"); }, 2000);
      } catch (err) { alert("Impossible d'accéder au presse-papier."); }
    }

    function parseCouponText(text) {
      try {
        const dateMatch = text.match(/📅 Date\s*:\s*([^\n]+)/i);
        const date = dateMatch ? dateMatch[1].trim() : new Date().toLocaleDateString("fr-FR");
        const blocks = text.split(/------------------------------|\n(?=\d+\.\s*\[)/);
        const selections = [];

        blocks.forEach(block => {
          const leagueMatch = block.match(/\[(.*?)\]/);
          const matchMatch = block.match(/⚔️\s*(.+)/);
          const pickMatch = block.match(/🎯 Prono\s*:\s*(.+)/);
          const oddsMatch = block.match(/📊 Cote\s*:\s*([\d\.,]+)/);
          const statusMatch = block.match(/📌 Statut\s*:\s*(?:✅|❌|⏳)?\s*(.+)/);

          if (leagueMatch && matchMatch && pickMatch) {
            const rawStatus = statusMatch ? statusMatch[1].trim().toUpperCase() : "EN_COURS";
            let status = "EN_COURS";
            if (rawStatus.includes("GAGNÉ") || rawStatus.includes("GAGNE")) status = "GAGNÉ";
            if (rawStatus.includes("PERDU")) status = "PERDU";

            selections.push({
              league: leagueMatch[1].trim(),
              match: matchMatch[1].trim(),
              pick: pickMatch[1].trim(),
              odds: oddsMatch ? parseFloat(oddsMatch[1].replace(',', '.')) : 1.00,
              status: status
            });
          }
        });
        return selections.length > 0 ? { date, selections } : null;
      } catch (e) { return null; }
    }

    function generateCouponPlainText(coupon) {
      const statusInfo = getCouponStatus(coupon.selections);
      let totalOdds = 1;
      let text = `==============================\n🎯 COUPON MULTI-CHAMPIONNATS\n📅 Date : ${coupon.date}\nRÉSULTAT : ${statusInfo.text}\n==============================\n\n`;

      coupon.selections.forEach((item, index) => {
        totalOdds *= item.odds;
        const icon = item.status === "GAGNÉ" ? "✅" : item.status === "PERDU" ? "❌" : "⏳";
        text += `${index + 1}. [${item.league.toUpperCase()}]\n   ⚔️ ${item.match}\n   🎯 Prono  : ${item.pick}\n   📊 Cote   : ${item.odds.toFixed(2)}\n   📌 Statut : ${icon} ${item.status}\n------------------------------\n`;
      });

      text += `\n🔥 COTE TOTALE : ${totalOdds.toFixed(2)}\n==============================`;
      return text;
    }

    async function handleCopyCoupon() {
      if (!activeCoupon) return;
      const btn = document.getElementById("btn-copy-coupon");
      try {
        await navigator.clipboard.writeText(generateCouponPlainText(activeCoupon));
        btn.innerHTML = "✅ Copié !";
        btn.classList.add("success");
        setTimeout(() => { btn.innerHTML = "📤 Copier"; btn.classList.remove("success"); }, 2000);
      } catch (err) { alert("Erreur lors de la copie."); }
    }

    function handleExportCoupon() {
      if (!activeCoupon) return;
      const blob = new Blob([generateCouponPlainText(activeCoupon)], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `coupon_${activeCoupon.id}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function getDemoCoupon() {
      return {
        id: "coupon_demo",
        date: new Date().toLocaleDateString("fr-FR"),
        selections: [
          { league: "Ligue 1", match: "PSG vs Marseille", pick: "Victoire PSG (1)", odds: 1.55, status: "GAGNÉ" },
          { league: "Premier League", match: "Arsenal vs Chelsea", pick: "Les 2 équipes marquent", odds: 1.70, status: "GAGNÉ" },
          { league: "La Liga", match: "Real Madrid vs Barça", pick: "+2.5 buts", odds: 1.65, status: "PERDU" }
        ]
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      const history = getHistory();
      if (history.length > 0) {
        activeCoupon = history[0];
      } else {
        activeCoupon = getDemoCoupon();
        saveCouponToHistory(activeCoupon);
      }
      renderActiveCouponUI(activeCoupon);
      renderHistoryUI();
    });
  </script>
</body>
</html>
